name: CI

on:
  push:
    branches: [main, "phase-*/**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      # The first install creates pnpm-lock.yaml; commit it, then switch to --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - name: End-to-end demo (mock providers)
        run: node apps/core/src/cli.ts demo
